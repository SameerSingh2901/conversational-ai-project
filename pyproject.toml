[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice calling agent for spinny for sales calling."
authors = []
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.mypy]
files = ["src", "tests"]
strict = true
# Lets mypy resolve tests/ as the `tests` package without an __init__.py,
# so the override below actually matches.
mypy_path = "src"
explicit_package_bases = true

# strict applies to src/ only; tests stay on relaxed rules.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Fail loudly on a typo'd key in this section instead of ignoring it.
addopts = ["--strict-config"]
# Warnings are failures: you migrate off deprecations on your schedule, not on
# the day something breaks. Add targeted "ignore::..." entries when a third-party
# warning is genuinely not yours to fix.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
