[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice calling agent for spinny for sales calling."
authors = []
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "livekit>=1.1.14",
    "livekit-agents>=1.6.9",
    "livekit-plugins-deepgram>=1.6.9",
    "livekit-plugins-elevenlabs>=1.6.9",
    "livekit-plugins-google>=1.6.9",
    "livekit-plugins-openai>=1.6.9",
    "livekit-plugins-silero>=1.6.9",
    "pinecone>=9.1.0",
    "pypdf>=6.15.0",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.10.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.ruff]
# Vendored third-party skills. Ours to read, not to reformat.
extend-exclude = [".claude/skills"]

[tool.mypy]
files = ["src", "tests"]
strict = true
# Lets mypy resolve tests/ as the `tests` package without an __init__.py,
# so the override below actually matches.
mypy_path = "src"
explicit_package_bases = true

# strict applies to src/ only; tests stay on relaxed rules.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Fail loudly on a typo'd key in this section instead of ignoring it.
addopts = ["--strict-config"]
# Warnings are failures: you migrate off deprecations on your schedule, not on
# the day something breaks. Add targeted "ignore::..." entries when a third-party
# warning is genuinely not yours to fix.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
