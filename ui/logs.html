<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Call log — Voice Agent</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="log-body-page">
  <main class="log-page">
    <p class="log-status" id="log-status">Loading…</p>

    <div id="log-body" hidden>
      <header class="log-head">
        <h1 id="log-title">call</h1>
        <p class="log-sub" id="log-sub"></p>
      </header>

      <p class="tools-warning" id="tools-warning" hidden></p>

      <section class="log-section">
        <h2>call</h2>
        <div class="log-rows" id="rows-call"></div>
      </section>

      <section class="log-section">
        <h2>usage</h2>
        <div class="log-rows" id="rows-usage"></div>
        <p class="log-note">
          Tokens, characters and audio seconds are what the providers invoice for.
        </p>
      </section>

      <section class="log-section" id="section-tools" hidden>
        <h2>tools</h2>
        <div class="log-rows" id="rows-tools"></div>
      </section>

      <section class="log-section">
        <h2>config snapshot</h2>
        <p class="log-note">
          Taken when the call started. The saved config may have been edited since;
          this is what actually ran.
        </p>
        <pre class="log-json" id="config-json"></pre>
      </section>
    </div>
  </main>

  <script src="/logs.js"></script>
</body>
</html>
